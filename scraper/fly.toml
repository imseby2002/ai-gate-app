# Fly.io deployment config — run: fly launch (first time) or fly deploy
app = "ota-scraper"
primary_region = "nrt"  # Tokyo — closest to TW/Agoda

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
