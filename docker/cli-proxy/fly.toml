# Fly.io 部署設定（CLI Proxy）。指令見 cli-proxy 頁面的「部署步驟」。
# app 名稱可改成你自己的（需全域唯一）；region 可改成離你近的（nrt=東京）。
app = "ai-gate-cli-proxy"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

# Fly 邊緣自動提供 https（https://<app>.fly.dev），内部轉發到容器的 8317
[http_service]
  internal_port = 8317
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# 持久化 OAuth 憑證（config.yaml 的 auth-dir: ~/.cli-proxy-api → /root/.cli-proxy-api）
[[mounts]]
  source = "cliproxy_data"
  destination = "/root/.cli-proxy-api"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
