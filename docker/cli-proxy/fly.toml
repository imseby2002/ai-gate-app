app = 'imseby-cli-proxy'

primary_region = 'sin'



[build]

dockerfile = 'Dockerfile'



[http_service]

internal_port = 8317

force_https = true

auto_stop_machines = 'off'

auto_start_machines = true

min_machines_running = 1

processes = ['app']



[[mounts]]

source = 'cliproxy_data'

destination = '/root/.cli-proxy-api'



[[vm]]

memory = '1gb'

cpus = 1

memory_mb = 1024

