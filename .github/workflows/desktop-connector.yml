# 在 Windows 打包 AI-GATE 桌面連接器成單一 .exe，發布到固定的 Release「connector-latest」
# 網頁下載連結：https://github.com/<owner>/<repo>/releases/download/connector-latest/<檔名>
# 檔案：AI-GATE-Connector.exe（Win10/11 x64）、-x86.exe、-arm64.exe、-Win7-x64.zip、-Win7-x86.zip
name: Desktop Connector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-connector/**'
      - '.github/workflows/desktop-connector.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-connector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build:exe -- --windows

      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view connector-latest >/dev/null 2>&1 || \
            gh release create connector-latest --title "AI-GATE 桌面連接器（最新版）" --notes "Windows 版 AI-GATE 桌面連接器：Win10/11 下載 .exe 雙擊執行；Win7/8 下載 Win7 壓縮檔，解壓後雙擊 Start-Connector.cmd。" --latest=false
          gh release upload connector-latest \
            dist/AI-GATE-Connector.exe \
            dist/AI-GATE-Connector-x86.exe \
            dist/AI-GATE-Connector-arm64.exe \
            dist/AI-GATE-Connector-Win7-x64.zip \
            dist/AI-GATE-Connector-Win7-x86.zip \
            --clobber
