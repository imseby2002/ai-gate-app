<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #1f2937; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; margin: 8px 0 2px; color: #6b7280; font-size: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    button { margin-top: 10px; width: 100%; padding: 7px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; font-size: 13px; cursor: pointer; }
    button.sec { background: #e5e7eb; color: #1f2937; }
    .row { display: flex; gap: 6px; }
    .row button { margin-top: 0; }
    .muted { color: #9ca3af; font-size: 11px; margin-top: 6px; }
    .ok { color: #059669; } .err { color: #dc2626; }
    hr { border: 0; border-top: 1px solid #eee; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>AI-GATE Booking 連接器</h1>

  <label>AI-GATE 網址</label>
  <input id="apiBase" placeholder="https://你的-ai-gate-網域" />

  <label>保活間隔（分，≥5）</label>
  <input id="keepAliveMin" type="number" min="5" value="10" />

  <button id="save">儲存設定</button>

  <hr />

  <label>配對碼（在 AI-GATE 網頁產生，10 分內有效）</label>
  <div class="row">
    <input id="pairCode" placeholder="XXXX-XXXX" />
    <button id="pair" style="width:90px">配對</button>
  </div>

  <div id="status" class="muted"></div>

  <script src="popup.js"></script>
</body>
</html>
