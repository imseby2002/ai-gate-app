<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP Video Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-6 px-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <!-- Header -->
        <div class="bg-indigo-600 px-6 py-6 text-white text-center">
            <div id="langSwitch" class="flex justify-center gap-1 mb-4"></div>
            <h1 id="title" class="text-xl font-bold"></h1>
            <p id="subtitle" class="text-xs text-indigo-100 mt-1"></p>
        </div>

        <div id="loading" class="p-6 text-center text-sm text-slate-500">…</div>

        <!-- Form container -->
        <form id="quizForm" class="hidden p-6 space-y-6" onsubmit="return false">
            <div class="space-y-2">
                <label id="nameLabel" for="name" class="text-xs font-semibold text-indigo-600 uppercase tracking-wider"></label>
                <input id="name" type="text" maxlength="50" class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div id="questions" class="space-y-6"></div>

            <div class="pt-4">
                <button id="submitBtn" type="button" onclick="submitQuiz()" class="w-full bg-indigo-600 text-white font-semibold py-3.5 px-4 rounded-xl shadow-md hover:bg-indigo-700 active:bg-indigo-800 transition-colors disabled:opacity-60"></button>
            </div>
        </form>

        <!-- Result Box (Hidden initially) -->
        <div id="resultBox" class="hidden p-6 border-t text-center">
            <h2 id="resultTitle" class="text-lg font-bold"></h2>
            <p id="resultDesc" class="text-sm mt-2"></p>
        </div>

        <!-- Review (Hidden initially) -->
        <div id="reviewBox" class="hidden p-6 border-t border-slate-200 space-y-4">
            <h2 id="reviewTitle" class="text-base font-bold text-slate-900"></h2>
            <div id="reviewList" class="space-y-4"></div>
        </div>
    </div>

    <script>
        const QUIZ_ID = 'sop-video';
        const LANGS = [
            { code: 'zh', label: '中文', html: 'zh-Hant' },
            { code: 'en', label: 'English', html: 'en' },
            { code: 'vi', label: 'Tiếng Việt', html: 'vi' },
        ];
        const T = {
            zh: {
                subtitle: '請完成以下 10 題選擇題',
                name: '姓名', namePh: '請輸入你的姓名',
                q: (i, n) => `第 ${i} 題 / 共 ${n} 題`,
                submit: '交卷', submitting: '交卷中...', submitted: '已交卷',
                needName: '交卷前請先輸入姓名！',
                needAll: '交卷前請回答所有題目！',
                failed: '交卷失敗，請再試一次！',
                loadFailed: '題目載入失敗，請重新整理頁面。',
                result: (s, t) => `你的成績：${s} / ${t} 分`,
                great: '太棒了！你已經完全掌握短影音製作 SOP。',
                good: '不錯！可以再複習 SOP 中的一些細節。',
                poor: '實戰前請再仔細複習 SOP 文件！',
                review: '正確答案與詳細說明',
                right: '✓ 答對', wrong: '✗ 答錯',
                chose: c => `你選 ${c}`,
                correct: '正確答案',
                qn: i => `第 ${i} 題`,
            },
            en: {
                subtitle: 'Please complete the 10 multiple-choice questions below',
                name: 'Full name', namePh: 'Enter your full name',
                q: (i, n) => `Question ${i} / ${n}`,
                submit: 'Submit', submitting: 'Submitting...', submitted: 'Submitted',
                needName: 'Please enter your name before submitting!',
                needAll: 'Please answer all questions before submitting!',
                failed: 'Submission failed, please try again!',
                loadFailed: 'Failed to load the questions. Please refresh the page.',
                result: (s, t) => `Your score: ${s} / ${t}`,
                great: 'Excellent! You have a solid grasp of the short video production SOP.',
                good: 'Good job! You may want to review a few details in the SOP.',
                poor: 'Please review the SOP more carefully before putting it into practice!',
                review: 'Answers & Detailed Explanations',
                right: '✓ Correct', wrong: '✗ Wrong',
                chose: c => `You chose ${c}`,
                correct: 'Correct answer',
                qn: i => `Question ${i}`,
            },
            vi: {
                subtitle: 'Vui lòng hoàn thành 10 câu hỏi trắc nghiệm dưới đây',
                name: 'Họ và tên', namePh: 'Nhập họ và tên của bạn',
                q: (i, n) => `Câu hỏi ${i} / ${n}`,
                submit: 'Nộp Bài', submitting: 'Đang nộp bài...', submitted: 'Đã nộp bài',
                needName: 'Vui lòng nhập họ và tên trước khi nộp bài!',
                needAll: 'Vui lòng trả lời tất cả các câu hỏi trước khi nộp bài!',
                failed: 'Nộp bài thất bại, vui lòng thử lại!',
                loadFailed: 'Không tải được câu hỏi, vui lòng tải lại trang.',
                result: (s, t) => `Kết quả của bạn: ${s} / ${t} điểm`,
                great: 'Xuất sắc! Bạn đã nắm rất vững bộ SOP sản xuất video ngắn.',
                good: 'Khá tốt! Bạn có thể xem lại một số chi tiết nhỏ trong SOP.',
                poor: 'Cần xem lại tài liệu SOP kỹ hơn trước khi thực chiến nhé!',
                review: 'Đáp án & Giải thích chi tiết',
                right: '✓ Đúng', wrong: '✗ Sai',
                chose: c => `Bạn chọn ${c}`,
                correct: 'Đáp án đúng',
                qn: i => `Câu ${i}`,
            },
        };

        let lang = pickLang();
        let quiz = null;      // { title, questions }
        let result = null;    // { score, total, key, answers }
        let submitting = false;

        function pickLang() {
            try {
                const saved = localStorage.getItem('quizLang');
                if (T[saved]) return saved;
            } catch (e) {}
            const nav = (navigator.language || '').toLowerCase();
            if (nav.startsWith('zh')) return 'zh';
            if (nav.startsWith('en')) return 'en';
            return 'vi';
        }

        function setLang(code) {
            lang = code;
            try { localStorage.setItem('quizLang', code); } catch (e) {}
            render();
        }

        function el(tag, className, text) {
            const e = document.createElement(tag);
            if (className) e.className = className;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function renderLangSwitch() {
            const box = document.getElementById('langSwitch');
            box.innerHTML = '';
            LANGS.forEach(l => {
                const b = el('button', `px-3 py-1 rounded-full text-xs font-semibold transition-colors ${l.code === lang ? 'bg-white text-indigo-700' : 'bg-indigo-500/60 text-white hover:bg-indigo-500'}`, l.label);
                b.type = 'button';
                b.onclick = () => setLang(l.code);
                box.appendChild(b);
            });
        }

        function renderQuestions() {
            const box = document.getElementById('questions');
            // 保留已選的答案，切換語言不會清掉
            const picked = {};
            box.querySelectorAll('input:checked').forEach(i => picked[i.name] = i.value);
            box.innerHTML = '';
            const n = quiz.questions.length;
            quiz.questions.forEach((q, idx) => {
                const wrap = el('div', `space-y-3 ${idx ? 'pt-4 border-t border-slate-100' : ''}`);
                wrap.appendChild(el('span', 'text-xs font-semibold text-indigo-600 uppercase tracking-wider', T[lang].q(idx + 1, n)));
                wrap.appendChild(el('p', 'font-medium text-sm text-slate-900', q.question[lang]));
                const opts = el('div', 'space-y-2');
                ['A', 'B', 'C'].forEach(opt => {
                    let cls = 'flex items-center gap-3 p-3 rounded-xl border cursor-pointer text-sm ';
                    if (result) {
                        const k = result.key[q.id];
                        if (opt === k.answer) cls += 'border-emerald-400 bg-emerald-50';
                        else if (opt === result.answers[q.id]) cls += 'border-rose-400 bg-rose-50';
                        else cls += 'border-slate-200';
                    } else {
                        cls += 'border-slate-200 hover:bg-slate-50';
                    }
                    const label = el('label', cls);
                    const input = el('input', 'text-indigo-600 focus:ring-indigo-500');
                    input.type = 'radio';
                    input.name = q.id;
                    input.value = opt;
                    const chosen = result ? result.answers[q.id] : picked[q.id];
                    if (chosen === opt) input.checked = true;
                    if (result || submitting) input.disabled = true;
                    label.appendChild(input);
                    label.appendChild(el('span', '', `${opt}. ${q.options[opt][lang]}`));
                    opts.appendChild(label);
                });
                wrap.appendChild(opts);
                box.appendChild(wrap);
            });
        }

        function renderResult() {
            const resultBox = document.getElementById('resultBox');
            const reviewBox = document.getElementById('reviewBox');
            if (!result) {
                resultBox.classList.add('hidden');
                reviewBox.classList.add('hidden');
                return;
            }
            const t = T[lang];
            const { score, total } = result;
            const tier = score >= 9
                ? ['great', 'bg-emerald-50 border-emerald-200', 'text-emerald-800']
                : score >= 7
                    ? ['good', 'bg-amber-50 border-amber-200', 'text-amber-800']
                    : ['poor', 'bg-rose-50 border-rose-200', 'text-rose-800'];
            resultBox.className = `p-6 border-t text-center ${tier[1]}`;
            document.getElementById('resultTitle').className = `text-lg font-bold ${tier[2]}`;
            document.getElementById('resultTitle').textContent = t.result(score, total);
            document.getElementById('resultDesc').className = `text-sm mt-2 ${tier[2]}`;
            document.getElementById('resultDesc').textContent = t[tier[0]];

            document.getElementById('reviewTitle').textContent = t.review;
            const list = document.getElementById('reviewList');
            list.innerHTML = '';
            quiz.questions.forEach((q, i) => {
                const k = result.key[q.id];
                const mine = result.answers[q.id];
                const ok = mine === k.answer;
                const item = el('div', `p-4 rounded-xl border text-sm space-y-2 ${ok ? 'border-emerald-200 bg-emerald-50/50' : 'border-rose-200 bg-rose-50/50'}`);
                item.appendChild(el('div', `font-semibold ${ok ? 'text-emerald-700' : 'text-rose-700'}`, `${t.qn(i + 1)}: ${ok ? t.right : t.wrong} — ${t.chose(mine)}`));
                item.appendChild(el('div', 'text-slate-900', `${t.correct}: ${k.answer}. ${q.options[k.answer][lang]}`));
                item.appendChild(el('div', 'text-slate-600 leading-relaxed', k.explanation[lang]));
                list.appendChild(item);
            });
            resultBox.classList.remove('hidden');
            reviewBox.classList.remove('hidden');
        }

        function renderSubmitBtn() {
            const btn = document.getElementById('submitBtn');
            const t = T[lang];
            btn.disabled = !!result || submitting;
            btn.textContent = result ? t.submitted : submitting ? t.submitting : t.submit;
        }

        function render() {
            const l = LANGS.find(x => x.code === lang);
            document.documentElement.lang = l.html;
            renderLangSwitch();
            const t = T[lang];
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('nameLabel').textContent = t.name;
            document.getElementById('name').placeholder = t.namePh;
            if (!quiz) return;
            document.title = quiz.title[lang];
            document.getElementById('title').textContent = quiz.title[lang];
            renderQuestions();
            renderSubmitBtn();
            renderResult();
        }

        async function submitQuiz() {
            const t = T[lang];
            const nameInput = document.getElementById('name');
            const name = nameInput.value.trim();
            if (!name) {
                alert(t.needName);
                nameInput.focus();
                return;
            }

            const answers = {};
            for (const q of quiz.questions) {
                const selected = document.querySelector(`input[name="${q.id}"]:checked`);
                if (!selected) {
                    alert(t.needAll);
                    return;
                }
                answers[q.id] = selected.value;
            }

            submitting = true;
            nameInput.disabled = true;
            render();

            try {
                const res = await fetch('/api/quiz/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quiz_id: QUIZ_ID, name, lang, answers })
                });
                if (!res.ok) throw new Error(String(res.status));
                const data = await res.json();
                result = { score: data.score, total: data.total, key: data.key, answers };
            } catch (e) {
                alert(T[lang].failed);
                nameInput.disabled = false;
            }
            submitting = false;
            render();
            if (result) document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
        }

        async function load() {
            render();
            try {
                const res = await fetch(`/api/quiz/${QUIZ_ID}`);
                if (!res.ok) throw new Error(String(res.status));
                quiz = await res.json();
            } catch (e) {
                document.getElementById('loading').textContent = T[lang].loadFailed;
                return;
            }
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('quizForm').classList.remove('hidden');
            render();
        }

        load();
    </script>
</body>
</html>
